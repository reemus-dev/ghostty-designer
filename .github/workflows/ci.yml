name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.10.13
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            xvfb procps fontconfig

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install dependencies
        run: mise run install

      - name: Run canonical checks
        run: mise run check

      - name: Launch and close the window
        run: mise run smoke

  scenarios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.10.13
          cache: true

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install dependencies
        run: mise run install

      - name: Install Ghostty 1.3.1
        run: |
          curl -sSLfo Ghostty.dmg https://release.files.ghostty.org/1.3.1/Ghostty.dmg
          echo "18cff2b0a6cee90eead9c7d3064e808a252a40baf214aa752c1ecb793b8f5f69  Ghostty.dmg" | shasum -a 256 -c
          hdiutil attach Ghostty.dmg -nobrowse -mountpoint /Volumes/Ghostty
          cp -R /Volumes/Ghostty/Ghostty.app /Applications/
          hdiutil detach /Volumes/Ghostty
          /Applications/Ghostty.app/Contents/MacOS/ghostty +version

      - name: Replay the session scenarios
        run: mise run test:scenarios

[env]
_.path = ["{{config_root}}/node_modules/.bin", "{{config_root}}/scripts"]

[tools]
bun = "1.4.3"
node = "26.8.1"
rust = { version = "1.99.0", components = "rustfmt,clippy" }

# ── Setup ───────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install the locked dependencies into node_modules"
run = "bun install --frozen-lockfile"

# ── App ─────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the app from source with the real environment and a hot-reloading UI (only the user runs this)"
run = "TAURI_APP_PATH=crates/app tauri dev --features webdriver"

[tasks."dev:reset"]
description = "Make the next `dev` run a first launch: delete the designer's state, preview files and include lines, keeping saved settings and themes (only the user runs this)"
run = '''
set -eu
state=${XDG_STATE_HOME:-$HOME/.local/state}/ghostty-designer
# A running designer holds an flock on the lock file.
if [ -e "$state/lock" ] && ! perl -MFcntl=:flock -e 'open my $f, "<", shift or die; flock $f, LOCK_EX | LOCK_NB or exit 1' "$state/lock"; then
  echo "A designer is running. Quit it first." >&2
  exit 1
fi
# An interrupted save can leave the only copy of the files it replaced here.
for backup in "$state"/previous-*; do
  if [ -d "$backup" ]; then
    echo "$backup holds files an interrupted save replaced. Recover or delete it first." >&2
    exit 1
  fi
done

for dir in "${XDG_CONFIG_HOME:-$HOME/.config}/ghostty" "$HOME/Library/Application Support/com.mitchellh.ghostty"; do
  rm -f "$dir/ghostty-designer.conf"
  for config in "$dir/config" "$dir/config.ghostty"; do
    if [ -f "$config" ]; then
      perl -0777 -pi -e 's/^\n?(# ghostty-designer: live preview.*\n)?config-file = \?ghostty-designer\.conf(\n|\z)//mg' "$config"
    fi
  done
done
rm -rf "$state"
'''

[tasks.build]
description = "Build the release app for this machine at dist/ghostty-designer"
depends = ["ui:build"]
run = '''
set -eu
cargo build --release --locked -p ghostty-designer
cp target/release/ghostty-designer dist/ghostty-designer
'''

[tasks.smoke]
description = "Launch the window in a sandbox, under Xvfb on Linux, and close it with SIGTERM"
depends = ["ui:build"]
run = "scripts/smoke.sh"

# ── Release ─────────────────────────────────────────────────────────────────

[tasks."release:version"]
description = "Write a release version into Cargo.toml and Cargo.lock, as the release workflow does from the tag"
run = "scripts/release.sh version"

[tasks."release:build"]
description = "Build the release files for this machine, or for a target triple, into dist/release"
depends = ["ui:build"]
run = "scripts/release.sh build"

[tasks."release:check"]
description = "Install and launch the release files for this machine or a target triple: on macOS here, on Linux in Docker containers"
run = "scripts/release.sh check"

[tasks."release:formula"]
description = "Print the Homebrew formula for the macOS archives in dist/release/checksums.txt"
run = "scripts/release.sh formula"

# ── UI bundle ───────────────────────────────────────────────────────────────

[tasks."ui:build"]
description = "Build the window's UI bundle to dist/ui, which the app crate embeds"
run = '''
set -eu
tailwindcss -i ui/styles.css -o ui/styles.gen.css --minify
rm -rf dist/ui
bun build ui/index.html --outdir dist/ui --production
'''

[tasks."ui:dev"]
description = "Serve the window's UI with hot-reloading UI and CSS, for `tauri dev`"
hide = true
run = '''
set -eu
tailwindcss -i ui/styles.css -o ui/styles.gen.css
tailwindcss -i ui/styles.css -o ui/styles.gen.css --watch=always &
trap 'kill $! 2>/dev/null || true' EXIT
bun --port=1420 ui/index.html
'''

# ── Checks ──────────────────────────────────────────────────────────────────

[tasks.check]
description = "Typecheck, lint, test, and check formatting of the TS and Rust code, without modifying files"
depends = ["typecheck", "lint", "test", "format:check"]

[tasks.typecheck]
description = "Typecheck the panel, then the scripts and tests, which alone see Bun's types"
run = ["tsc -p tsconfig.app.json", "tsc -p tsconfig.bun.json"]

[tasks.lint]
description = "Lint the TS and Rust code without modifying files"
depends = ["lint:oxlint", "lint:clippy"]

[tasks."lint:oxlint"]
description = "Lint the TS code"
run = "oxlint"

[tasks."lint:clippy"]
description = "Lint the Rust workspace"
depends = ["ui:build"]
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the UI and Rust tests"
depends = ["test:bun", "test:cargo"]

[tasks."test:bun"]
description = "Run the UI tests"
run = "bun test"

[tasks."test:cargo"]
description = "Run the Rust tests"
depends = ["ui:build"]
run = "cargo test --workspace --locked"

[tasks."test:scenarios"]
description = "Replay the session scenarios against Ghostty 1.3.1 in sandboxes; UPDATE_RECORDINGS=1 rewrites the recordings"
run = [
  "cargo build --locked -p ghostty-designer-host --example stdio-host",
  "bun test --max-concurrency=4 ./ui/core/testing/replay.ts",
]

[tasks."format:check"]
description = "Check formatting of repository files and the Rust code without modifying files"
run = ["oxfmt --check", "cargo fmt --all --check"]

# ── Fixes ───────────────────────────────────────────────────────────────────

[tasks.fix]
description = "Apply oxlint's safe fixes, then format repository files"
run = ["oxlint --fix", { task = "format" }]

[tasks.format]
description = "Format repository files and the Rust code"
run = ["oxfmt", "cargo fmt --all"]

# The cover's look: the sandbox config that the panel edits and both
# terminals load. Appearance keys only.

font-family = RobotoMono Nerd Font
font-size = 16
adjust-cell-height = 11%
window-colorspace = srgb
window-padding-x = 16
window-padding-y = 12
window-padding-balance = true
window-padding-color = background
window-save-state = never
macos-titlebar-style = transparent
cursor-style = bar
bold-color = bright

background = #121212
foreground = #FAF9F6
cursor-color = #FC7D54
cursor-text = #121212
selection-background = #4C3128
selection-foreground = cell-foreground

palette = 0=#3D3D3D
palette = 1=#FF7178
palette = 2=#70CD82
palette = 3=#F6C260
palette = 4=#65B3F6
palette = 5=#E090E4
palette = 6=#23D8DC
palette = 7=#E7E3E0
palette = 8=#A09C96
palette = 9=#FF989A
palette = 10=#97E79B
palette = 11=#FFDF90
palette = 12=#8DCAFF
palette = 13=#F8B7FF
palette = 14=#6CEEF1
palette = 15=#FFFDF8

config-file = ?ghostty-designer.conf
